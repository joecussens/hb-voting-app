<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>H&B AI Policy Workshop — Voting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --navy: #0E2841;
    --blue: #156082;
    --grey: #E8E8E8;
    --white: #FFFFFF;
    --ink: #0E2841;
    --muted: #6B7785;
    --green: #2E7D46;
    --amber: #D99A1B;
    --red: #C4463A;
    --depends: #8A93A0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Montserrat', sans-serif; background: #F7F8F9; color: var(--ink); -webkit-tap-highlight-color: transparent; }
  button { font-family: 'Montserrat', sans-serif; cursor: pointer; }
  .btn { font-weight: 600; font-size: 15px; padding: 12px 20px; border-radius: 8px; border: none; transition: transform .08s ease, opacity .15s ease; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-dark { background: var(--navy); color: #fff; }
  .btn-ghost { background: transparent; color: var(--navy); border: 1.5px solid var(--navy); }
  .btn-subtle { background: var(--grey); color: var(--navy); }
  .btn-success { background: var(--green); color: #fff; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .role-screen { min-height: 100vh; background: var(--navy); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; }
  .role-eyebrow { color:#fff; font-size:13px; opacity:.7; margin-bottom:8px; letter-spacing:.5px; }
  .role-title { color:#fff; font-size:28px; font-weight:700; margin:0 0 36px; max-width:380px; }
  .role-buttons { display:flex; flex-direction:column; gap:14px; width:100%; max-width:320px; }
  .p-header { background: var(--navy); color:#fff; padding:16px 20px; font-size:13px; opacity:.9; flex-shrink:0; }
  .p-body { flex:1; padding:20px; display:flex; flex-direction:column; min-height: calc(100vh - 54px); }
  .risk-screen { height: 100dvh; display:flex; flex-direction:column; overflow:hidden; }
  .risk-content { flex:1; padding:16px 20px; display:flex; flex-direction:column; overflow:hidden; min-height:0; }
  .vote-btn { font-weight:700; font-size:16px; padding:14px; border-radius:10px; border:3px solid transparent; color:#fff; }
  .scenario-text { font-size:19px; font-weight:600; line-height:1.35; margin-bottom:16px; overflow-y:auto; min-height:0; }
  .vote-group { display:flex; flex-direction:column; gap:8px; margin-top:auto; flex-shrink:0; }
  .vote-confirm { text-align:center; margin-top:8px; color:var(--muted); font-size:12px; min-height:16px; flex-shrink:0; }
  .rank-row { display:flex; align-items:center; background:#fff; border-radius:10px; border:1.5px solid #DDE3E8; padding:12px 10px 12px 16px; margin-bottom:10px; position:relative; touch-action: none; cursor:grab; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  .rank-num { width:28px; height:28px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; margin-right:12px; flex-shrink:0; -webkit-user-select:none; user-select:none; }
  .rank-name { flex:1; font-size:15px; font-weight:500; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .rank-handle { touch-action:none; padding:8px 10px; font-size:18px; color:var(--muted); user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .el-group-label { font-size:12px; font-weight:700; color:var(--blue); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
  .el-btn { display:block; width:100%; text-align:left; font-size:15px; font-weight:500; padding:13px 14px; border-radius:8px; border:2px solid #DDE3E8; background:#fff; color:var(--ink); margin-bottom:8px; }
  .el-btn.picked { font-weight:700; border-color:var(--blue); background:#EAF3F6; }
  .el-btn:disabled { color:#B7BEC6; cursor:not-allowed; }
  .el-badge { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; background:var(--navy); color:#fff; font-size:12px; font-weight:700; margin-right:10px; flex-shrink:0; vertical-align:middle; }
  .fixed-submit { position:fixed; bottom:0; left:0; right:0; padding:16px; background:#fff; border-top:1px solid #E2E6EA; }
  .top-bar { background:var(--navy); color:#fff; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  .tab-btn { font-weight:600; font-size:14px; padding:8px 16px; border-radius:20px; border:none; background:rgba(255,255,255,.12); color:#fff; }
  .tab-btn.active { background: var(--blue); }
  .panel-grid { padding:24px; display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
  @media (max-width: 860px) { .panel-grid { grid-template-columns: 1fr; } }
  .card { background:#fff; border-radius:12px; padding:24px; }
  .bar-row { margin-bottom:14px; }
  .bar-label-row { display:flex; justify-content:space-between; margin-bottom:4px; font-size:14px; }
  .bar-track { background:#EEF1F3; border-radius:6px; height:22px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:6px; transition:width .4s ease; }
  table.pattern { border-collapse:collapse; width:100%; }
  table.pattern th { font-size:11px; color:var(--muted); padding:4px 6px; font-weight:500; }
  table.pattern td { padding:4px 6px; }
  .cell { width:18px; height:18px; border-radius:4px; background:#EEF1F3; }
  .waiting { align-items:center; justify-content:center; text-align:center; }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ---------- Config ---------- */
const SUPABASE_URL = "https://bwpdumhphvsjnereiain.supabase.co";
const SUPABASE_KEY = "sb_publishable_pEuI_f9YnPhtpkdaeFzidA_1ZXi8Beb";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const VOTE_COLORS = { green: "#2E7D46", amber: "#D99A1B", red: "#C4463A" };
const VOTE_LABELS = { green: "Green", amber: "Amber", red: "Red" };
const VOTE_ORDER = ["green", "amber", "red"];
const ELEMENT_CAP = 8;
const POLL_MS = 2500;

const SCENARIOS = [
  "An AI phone agent taking table bookings",
  "Using AI to screen job applications",
  "AI-written social copy onto a pub's Facebook page, no review",
  "AI assistant to draft a response to a customer complaint, with name and address",
  "Copilot to review existing commercial lease and summarise break clauses",
  "Auto-ordering stock from an AI demand forecast, no human sign-off",
];

const PILLARS = [
  { id: "p1", name: "Universal Parameters" },
  { id: "p2", name: "Accountability" },
  { id: "p3", name: "Human Oversight" },
  { id: "p4", name: "Technical & Tools" },
  { id: "p5", name: "Data & Privacy" },
  { id: "p6", name: "Fairness, Societal & Environmental" },
];

const ELEMENTS = [
  { id: "e1", pillar: "p1", name: "Strategy and objectives" },
  { id: "e2", pillar: "p1", name: "Brand and reputation" },
  { id: "e3", pillar: "p1", name: "Values" },
  { id: "e4", pillar: "p2", name: "Accountability" },
  { id: "e5", pillar: "p2", name: "Incident response and the off switch" },
  { id: "e6", pillar: "p2", name: "Getting a yes, and challenging a no" },
  { id: "e7", pillar: "p2", name: "Ownership and review" },
  { id: "e8", pillar: "p3", name: "Acceptable use" },
  { id: "e9", pillar: "p3", name: "Human review and sign-off" },
  { id: "e10", pillar: "p3", name: "What must never be automated" },
  { id: "e11", pillar: "p4", name: "Approved tools" },
  { id: "e12", pillar: "p4", name: "Accounts, licences and access" },
  { id: "e13", pillar: "p4", name: "Third-party and supplier AI" },
  { id: "e14", pillar: "p4", name: "AI inventory" },
  { id: "e15a", pillar: "p5", name: "Where data is held and processed" },
  { id: "e15b", pillar: "p5", name: "What will we hold and use" },
  { id: "e15e", pillar: "p5", name: "How will AI impact existing security protocols?" },
  { id: "e16", pillar: "p6", name: "Transparency and disclosure" },
  { id: "e17", pillar: "p6", name: "Ethics, diversity and fairness" },
  { id: "e18", pillar: "p6", name: "Impact on people and jobs" },
  { id: "e19", pillar: "p6", name: "Accessibility and exclusion" },
  { id: "e20", pillar: "p6", name: "Environmental impact" },
];

function makeDeviceId() {
  if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  return "id-" + Math.random().toString(16).slice(2) + Date.now().toString(16);
}
function shortId(id) { return id.replace(/-/g, "").slice(-4).toUpperCase(); }
const DEVICE_ID = makeDeviceId();

const root = document.getElementById("root");
let role = null;
let pollTimer = null;

/* ---------- Data access ---------- */
async function getControl() {
  const { data, error } = await sb.from("control_state").select("*").eq("id", 1).single();
  if (error) return { exercise: "idle", risk_index: 0, priority_stage: 1 };
  return data;
}
async function setControl(patch) {
  await sb.from("control_state").update({ ...patch, updated_at: new Date().toISOString() }).eq("id", 1);
}
async function getMyRisk() {
  const { data } = await sb.from("risk_votes").select("votes").eq("device_id", DEVICE_ID).maybeSingle();
  return (data && data.votes) || {};
}
async function castRiskVote(scenarioIndex, vote) {
  const current = await getMyRisk();
  current[scenarioIndex] = vote;
  await sb.from("risk_votes").upsert(
    { device_id: DEVICE_ID, votes: current, updated_at: new Date().toISOString() },
    { onConflict: "device_id" }
  );
  return current;
}
async function getMyPriority() {
  const { data } = await sb.from("priority_votes").select("pillars,elements").eq("device_id", DEVICE_ID).maybeSingle();
  return data || { pillars: null, elements: null };
}
async function submitPillars(order) {
  const existing = await getMyPriority();
  await sb.from("priority_votes").upsert(
    { device_id: DEVICE_ID, pillars: order, elements: existing.elements || null, updated_at: new Date().toISOString() },
    { onConflict: "device_id" }
  );
}
async function submitElements(picks) {
  const existing = await getMyPriority();
  await sb.from("priority_votes").upsert(
    { device_id: DEVICE_ID, pillars: existing.pillars || null, elements: picks, updated_at: new Date().toISOString() },
    { onConflict: "device_id" }
  );
}
async function getAllRisk() {
  const { data } = await sb.from("risk_votes").select("device_id,votes");
  return data || [];
}
async function getAllPriority() {
  const { data } = await sb.from("priority_votes").select("device_id,pillars,elements");
  return data || [];
}
async function resetAllData() {
  await sb.from("risk_votes").delete().neq("device_id", "");
  await sb.from("priority_votes").delete().neq("device_id", "");
  await setControl({ exercise: "idle", risk_index: 0, priority_stage: 1 });
}

/* ---------- Role select ---------- */
function renderRoleSelect() {
  root.innerHTML = `
    <div class="role-screen">
      <div class="role-eyebrow">Heron &amp; Brearley · AI Policy Workshop</div>
      <h1 class="role-title">How are you joining today?</h1>
      <div class="role-buttons">
        <button class="btn btn-primary" id="pick-participant" style="padding:18px 20px;font-size:17px;">I'm voting</button>
        <button class="btn" id="pick-facilitator" style="padding:16px 20px;font-size:15px;background:transparent;color:#fff;border:1.5px solid var(--blue);">I'm facilitating</button>
      </div>
    </div>`;
  document.getElementById("pick-participant").onclick = () => { role = "participant"; startParticipant(); };
  document.getElementById("pick-facilitator").onclick = () => { role = "facilitator"; startFacilitator(); };
}

/* ================= PARTICIPANT ================= */
let participantLocalRisk = {};
let participantPillarOrder = null;
let participantPillarsSubmitted = false;
let participantSelectedElements = [];
let participantRankedElements = [];
let participantStage2View = "choose";
let participantElementsSubmitted = false;

async function startParticipant() {
  await renderParticipant();
  pollTimer = setInterval(renderParticipant, POLL_MS);
}

let lastControlSignature = null;

async function renderParticipant() {
  const control = await getControl();
  const signature = JSON.stringify(control);
  if (signature === lastControlSignature) {
    return;
  }
  lastControlSignature = signature;

  if (control.exercise === "idle") {
    root.innerHTML = `
      <div class="p-header">Heron &amp; Brearley · AI Policy Workshop</div>
      <div class="p-body waiting">
        <div style="font-size:40px;margin-bottom:16px;">⏳</div>
        <div style="font-size:18px;font-weight:600;">Waiting for the facilitator to start</div>
        <div style="font-size:14px;color:var(--muted);margin-top:6px;">Nothing to do yet — keep this open.</div>
      </div>`;
    return;
  }

  if (control.exercise === "risk") {
    if (Object.keys(participantLocalRisk).length === 0) participantLocalRisk = await getMyRisk();
    renderRiskParticipant(control);
    return;
  }

  if (control.exercise === "priority" && control.priority_stage === 1) {
    if (!participantPillarOrder) {
      const mine = await getMyPriority();
      participantPillarOrder = mine.pillars
        ? mine.pillars.map((id) => PILLARS.find((p) => p.id === id)).filter(Boolean)
        : PILLARS.slice();
    }
    renderPriorityStage1(control);
    return;
  }

  if (control.exercise === "priority" && control.priority_stage === 2) {
    if (participantSelectedElements.length === 0) {
      const mine = await getMyPriority();
      if (mine.elements) {
        participantSelectedElements = mine.elements;
        participantRankedElements = mine.elements.map((id) => ELEMENTS.find((e) => e.id === id)).filter(Boolean);
      }
    }
    renderPriorityStage2(control);
    return;
  }
}
function renderRiskParticipant(control) {
  const scenario = SCENARIOS[control.risk_index];
  const currentVote = participantLocalRisk[control.risk_index];
  root.innerHTML = `
    <div class="risk-screen">
      <div class="p-header">Scenario ${control.risk_index + 1} of ${SCENARIOS.length}</div>
      <div class="risk-content">
        <div class="scenario-text">${scenario}</div>
        <div class="vote-group">
          ${VOTE_ORDER.map((v) => `
            <button class="vote-btn" data-vote="${v}" style="background:${VOTE_COLORS[v]};border-color:${currentVote === v ? "var(--navy)" : "transparent"};opacity:${currentVote && currentVote !== v ? 0.55 : 1};">
              ${VOTE_LABELS[v]}
            </button>`).join("")}
        </div>
        <div class="vote-confirm">${currentVote ? "✓ Voted — tap another option to change your answer" : ""}</div>
      </div>
    </div>`;
  root.querySelectorAll("[data-vote]").forEach((btn) => {
    btn.onclick = async () => {
      participantLocalRisk = await castRiskVote(control.risk_index, btn.dataset.vote);
      renderRiskParticipant(control);
    };
  });
}

function renderPriorityStage1(control) {
  root.innerHTML = `
    <div class="p-header">Priority vote · Stage 1 of 2 — rank the pillars</div>
    <div class="p-body">
      <div style="font-size:15px;color:var(--muted);margin-bottom:18px;line-height:1.5;">
        Drag using the handle to put these in order — <strong>most important to resolve first at the top.</strong>
      </div>
      <div id="rank-list"></div>
      <div style="margin-top:24px;">
        <button class="btn ${participantPillarsSubmitted ? "btn-success" : "btn-dark"}" id="submit-pillars" style="width:100%;padding:16px;font-size:16px;">
          ${participantPillarsSubmitted ? "✓ Submitted — tap to update" : "Submit ranking"}
        </button>
      </div>
    </div>`;
  renderRankList();
  document.getElementById("submit-pillars").onclick = async () => {
    await submitPillars(participantPillarOrder.map((p) => p.id));
    participantPillarsSubmitted = true;
    renderPriorityStage1(control);
  };
}

function renderRankList() {
  const container = document.getElementById("rank-list");
  renderGenericDragList(
    container,
    () => participantPillarOrder,
    (v) => { participantPillarOrder = v; },
    markPillarsUnsubmittedIfNeeded
  );
}

function renderGenericDragList(container, getItems, setItems, onChange) {
  container.innerHTML = "";
  getItems().forEach((item, i) => {
    const row = document.createElement("div");
    row.className = "rank-row";
    row.dataset.id = item.id;
    row.innerHTML = `
      <div class="rank-num">${i + 1}</div>
      <div class="rank-name">${item.name}</div>
      <div class="rank-handle">⠿</div>`;
    container.appendChild(row);
  });
  attachGenericDragHandlers(container, getItems, setItems, onChange);
}

function attachGenericDragHandlers(container, getItems, setItems, onChange) {
  let dragEl = null;
  let startY0 = 0;
  let startIndex0 = 0;
  let initialTops = [];
  let initialHeights = [];
  let originalOrderSnapshot = [];
  let draggedId = null;

  container.querySelectorAll(".rank-row").forEach((row) => {
    row.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      row.setPointerCapture(e.pointerId);
      dragEl = row;
      draggedId = dragEl.dataset.id;
      startY0 = e.clientY;

      const rows = Array.from(container.children);
      startIndex0 = rows.indexOf(dragEl);
      initialTops = rows.map((r) => r.getBoundingClientRect().top);
      initialHeights = rows.map((r) => r.getBoundingClientRect().height);
      originalOrderSnapshot = getItems().slice();

      dragEl.style.zIndex = 5;
      dragEl.style.boxShadow = "0 6px 16px rgba(14,40,65,0.18)";
      dragEl.style.borderColor = "var(--blue)";
    });

    row.addEventListener("pointermove", (e) => {
      if (!dragEl) return;
      const totalDeltaY = e.clientY - startY0;
      dragEl.style.transform = `translateY(${totalDeltaY}px)`;

      const draggedCenter = initialTops[startIndex0] + initialHeights[startIndex0] / 2 + totalDeltaY;

      let targetIndex = 0;
      for (let i = 0; i < initialTops.length; i++) {
        if (i === startIndex0) continue;
        const otherCenter = initialTops[i] + initialHeights[i] / 2;
        if (draggedCenter > otherCenter) targetIndex++;
      }
      targetIndex = Math.min(Math.max(targetIndex, 0), originalOrderSnapshot.length - 1);

      const newOrder = originalOrderSnapshot.filter((p) => p.id !== draggedId);
      const draggedItem = originalOrderSnapshot.find((p) => p.id === draggedId);
      newOrder.splice(targetIndex, 0, draggedItem);
      setItems(newOrder);

      Array.from(container.children).forEach((rowEl) => {
        if (rowEl === dragEl) return;
        const pos = newOrder.findIndex((p) => p.id === rowEl.dataset.id);
        rowEl.querySelector(".rank-num").textContent = pos + 1;
      });
      dragEl.querySelector(".rank-num").textContent = targetIndex + 1;

      if (onChange) onChange();
    });

    function endDrag() {
      dragEl = null;
      renderGenericDragList(container, getItems, setItems, onChange);
    }
    row.addEventListener("pointerup", endDrag);
    row.addEventListener("pointercancel", endDrag);
  });
}

function markPillarsUnsubmittedIfNeeded() {
  if (participantPillarsSubmitted) {
    participantPillarsSubmitted = false;
    const btn = document.getElementById("submit-pillars");
    if (btn) {
      btn.textContent = "Submit ranking";
      btn.classList.remove("btn-success");
      btn.classList.add("btn-dark");
    }
  }
}

function syncRankedElementsFromSelection() {
  const kept = participantRankedElements.filter((e) => participantSelectedElements.includes(e.id));
  const keptIds = kept.map((e) => e.id);
  const added = participantSelectedElements
    .filter((id) => !keptIds.includes(id))
    .map((id) => ELEMENTS.find((e) => e.id === id))
    .filter(Boolean);
  participantRankedElements = [...kept, ...added];
}

function markElementsUnsubmittedIfNeeded() {
  if (participantElementsSubmitted) {
    participantElementsSubmitted = false;
    const btn = document.getElementById("submit-elements");
    if (btn) {
      btn.textContent = "Submit ranking";
      btn.classList.remove("btn-success");
      btn.classList.add("btn-dark");
    }
  }
}

function renderPriorityStage2(control) {
  if (participantStage2View === "rank") {
    renderPriorityStage2Rank(control);
  } else {
    renderPriorityStage2Choose(control);
  }
}

function renderPriorityStage2Choose(control) {
  const groupsHtml = PILLARS.map((pillar) => `
    <div style="margin-bottom:18px;">
      <div class="el-group-label">${pillar.name}</div>
      ${ELEMENTS.filter((e) => e.pillar === pillar.id).map((el) => {
        const pickIndex = participantSelectedElements.indexOf(el.id);
        const picked = pickIndex !== -1;
        const disabled = !picked && participantSelectedElements.length >= ELEMENT_CAP;
        const badge = picked ? `<span class="el-badge">${pickIndex + 1}</span>` : "";
        return `<button class="el-btn ${picked ? "picked" : ""}" data-el="${el.id}" ${disabled ? "disabled" : ""}>${badge}${el.name}</button>`;
      }).join("")}
    </div>`).join("");

  root.innerHTML = `
    <div class="p-header">Priority vote · Stage 2 of 2 — pick your top ${ELEMENT_CAP} (${participantSelectedElements.length}/${ELEMENT_CAP})</div>
    <div class="p-body" style="padding-bottom:100px;">
      <div style="font-size:14px;color:var(--muted);margin-bottom:16px;">What does H&amp;B most need to resolve in the next 90 days?</div>
      ${groupsHtml}
    </div>
    <div class="fixed-submit">
      <button class="btn btn-dark" id="go-to-rank" style="width:100%;padding:16px;font-size:16px;" ${participantSelectedElements.length === 0 ? "disabled" : ""}>
        Next — rank your ${participantSelectedElements.length || ""} picks →
      </button>
    </div>`;

  root.querySelectorAll("[data-el]").forEach((btn) => {
    btn.onclick = () => {
      const id = btn.dataset.el;
      const idx = participantSelectedElements.indexOf(id);
      if (idx > -1) participantSelectedElements.splice(idx, 1);
      else if (participantSelectedElements.length < ELEMENT_CAP) participantSelectedElements.push(id);
      renderPriorityStage2Choose(control);
    };
  });
  document.getElementById("go-to-rank").onclick = () => {
    syncRankedElementsFromSelection();
    participantStage2View = "rank";
    renderPriorityStage2Rank(control);
  };
}

function renderPriorityStage2Rank(control) {
  root.innerHTML = `
    <div class="p-header">Priority vote · Stage 2 of 2 — rank your picks (most important first)</div>
    <div class="p-body">
      <button class="btn btn-ghost" id="back-to-choose" style="margin-bottom:14px;padding:8px 14px;font-size:13px;">← Edit picks</button>
      <div style="font-size:14px;color:var(--muted);margin-bottom:14px;line-height:1.5;">
        Drag to put these in order — <strong>most important to resolve first at the top.</strong>
      </div>
      <div id="element-rank-list"></div>
      <div style="margin-top:24px;">
        <button class="btn ${participantElementsSubmitted ? "btn-success" : "btn-dark"}" id="submit-elements" style="width:100%;padding:16px;font-size:16px;">
          ${participantElementsSubmitted ? "✓ Submitted — tap to update" : "Submit ranking"}
        </button>
      </div>
    </div>`;

  const container = document.getElementById("element-rank-list");
  renderGenericDragList(
    container,
    () => participantRankedElements,
    (v) => { participantRankedElements = v; },
    markElementsUnsubmittedIfNeeded
  );

  document.getElementById("back-to-choose").onclick = () => {
    participantStage2View = "choose";
    renderPriorityStage2Choose(control);
  };
  document.getElementById("submit-elements").onclick = async () => {
    await submitElements(participantRankedElements.map((e) => e.id));
    participantElementsSubmitted = true;
    renderPriorityStage2Rank(control);
  };
}

/* ================= FACILITATOR ================= */
async function startFacilitator() {
  await renderFacilitator();
  pollTimer = setInterval(renderFacilitator, POLL_MS);
}

let confirmingReset = false;

async function renderFacilitator() {
  const control = await getControl();
  const riskRows = await getAllRisk();
  const priorityRows = await getAllPriority();
  const deviceCount = new Set([...riskRows.map((r) => r.device_id), ...priorityRows.map((r) => r.device_id)]).size;

  root.innerHTML = `
    <div class="top-bar">
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
        <strong style="font-size:15px;">H&amp;B Workshop — Facilitator</strong>
        <button class="tab-btn ${control.exercise === "risk" ? "active" : ""}" id="tab-risk">Risk Spectrum</button>
        <button class="tab-btn ${control.exercise === "priority" ? "active" : ""}" id="tab-priority">Priority Vote</button>
      </div>
      <div style="display:flex;align-items:center;gap:10px;font-size:13px;">
        <span style="opacity:.8;">${deviceCount} device${deviceCount === 1 ? "" : "s"} active</span>
        <button class="btn btn-subtle" id="export-btn" style="padding:8px 14px;font-size:13px;">Export data</button>
        ${!confirmingReset
          ? `<button class="btn btn-ghost" id="reset-btn" style="padding:8px 14px;font-size:13px;color:#fff;border-color:rgba(255,255,255,.4);">Reset all</button>`
          : `<span style="font-size:12px;">Clear all votes?</span>
             <button class="btn btn-primary" id="confirm-reset" style="padding:8px 14px;font-size:13px;background:var(--red);">Confirm</button>
             <button class="btn btn-ghost" id="cancel-reset" style="padding:8px 14px;font-size:13px;color:#fff;border-color:rgba(255,255,255,.4);">Cancel</button>`}
      </div>
    </div>
    <div id="panel"></div>`;

  document.getElementById("tab-risk").onclick = async () => { await setControl({ exercise: "risk", risk_index: 0, priority_stage: 1 }); renderFacilitator(); };
  document.getElementById("tab-priority").onclick = async () => { await setControl({ exercise: "priority", risk_index: 0, priority_stage: 1 }); renderFacilitator(); };
  document.getElementById("export-btn").onclick = () => exportCSV(riskRows, priorityRows);
  if (!confirmingReset) {
    document.getElementById("reset-btn").onclick = () => { confirmingReset = true; renderFacilitator(); };
  } else {
    document.getElementById("confirm-reset").onclick = async () => { await resetAllData(); confirmingReset = false; renderFacilitator(); };
    document.getElementById("cancel-reset").onclick = () => { confirmingReset = false; renderFacilitator(); };
  }

  const panel = document.getElementById("panel");
  if (control.exercise === "idle") {
    panel.innerHTML = `<div style="padding:60px;text-align:center;color:var(--muted);">Choose an exercise above to begin.</div>`;
  } else if (control.exercise === "risk") {
    renderRiskFacilitatorPanel(panel, control, riskRows);
  } else if (control.exercise === "priority") {
    renderPriorityFacilitatorPanel(panel, control, priorityRows);
  }
}

let riskFacilitatorView = "single";

function renderRiskFacilitatorPanel(panel, control, riskRows) {
  const toggleHtml = `
    <div style="padding:24px 24px 0;display:flex;gap:12px;">
      <button class="btn ${riskFacilitatorView === "single" ? "btn-dark" : "btn-subtle"}" id="risk-view-single">Scenario view</button>
      <button class="btn ${riskFacilitatorView === "summary" ? "btn-dark" : "btn-subtle"}" id="risk-view-summary">Full summary</button>
    </div>`;

  if (riskFacilitatorView === "summary") {
    panel.innerHTML = toggleHtml + renderRiskSummaryHTML(riskRows);
    document.getElementById("risk-view-single").onclick = () => { riskFacilitatorView = "single"; renderFacilitator(); };
    document.getElementById("risk-view-summary").onclick = () => { riskFacilitatorView = "summary"; renderFacilitator(); };
    return;
  }

  const scenario = SCENARIOS[control.risk_index];
  const counts = { green: 0, amber: 0, red: 0 };
  let total = 0;
  riskRows.forEach((row) => {
    const v = row.votes && row.votes[control.risk_index];
    if (v && counts[v] !== undefined) { counts[v] += 1; total += 1; }
  });

  panel.innerHTML = toggleHtml + `
    <div class="panel-grid">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <button class="btn btn-ghost" id="prev-scenario" ${control.risk_index === 0 ? "disabled" : ""}>← Prev</button>
          <div style="font-size:13px;color:var(--muted);font-weight:600;">Scenario ${control.risk_index + 1} / ${SCENARIOS.length}</div>
          <button class="btn btn-dark" id="next-scenario" ${control.risk_index === SCENARIOS.length - 1 ? "disabled" : ""}>Next →</button>
        </div>
        <div style="font-size:20px;font-weight:700;margin-bottom:10px;line-height:1.4;">${scenario}</div>
        <div style="margin-top:28px;">
          ${VOTE_ORDER.map((v) => `
            <div class="bar-row">
              <div class="bar-label-row"><span style="font-weight:600;">${VOTE_LABELS[v]}</span><span style="color:var(--muted);">${counts[v]}</span></div>
              <div class="bar-track"><div class="bar-fill" style="width:${total ? (counts[v] / total) * 100 : 0}%;background:${VOTE_COLORS[v]};"></div></div>
            </div>`).join("")}
          <div style="font-size:12px;color:var(--muted);margin-top:4px;">${total} vote${total === 1 ? "" : "s"} so far</div>
        </div>
      </div>
      <div class="card">
        <div style="font-size:14px;font-weight:700;margin-bottom:14px;">Live pattern by device</div>
        ${riskRows.length === 0 ? `<div style="color:var(--muted);font-size:13px;">No votes yet.</div>` : `
        <div style="overflow-x:auto;">
          <table class="pattern">
            <thead><tr><th style="text-align:left;">Device</th>${SCENARIOS.map((_, i) => `<th style="color:${i === control.risk_index ? "var(--navy)" : "var(--muted)"};font-weight:${i === control.risk_index ? 800 : 500};">${i + 1}</th>`).join("")}</tr></thead>
            <tbody>
              ${riskRows.map((row) => `
                <tr>
                  <td style="font-family:monospace;color:var(--muted);">${shortId(row.device_id)}</td>
                  ${SCENARIOS.map((_, i) => {
                    const v = row.votes && row.votes[i];
                    return `<td><div class="cell" style="background:${v ? VOTE_COLORS[v] : "#EEF1F3"};${i === control.risk_index ? "border:2px solid var(--navy);" : ""}" title="${v ? VOTE_LABELS[v] : "no vote"}"></div></td>`;
                  }).join("")}
                </tr>`).join("")}
            </tbody>
          </table>
        </div>`}
      </div>
    </div>`;

  document.getElementById("risk-view-single").onclick = () => { riskFacilitatorView = "single"; renderFacilitator(); };
  document.getElementById("risk-view-summary").onclick = () => { riskFacilitatorView = "summary"; renderFacilitator(); };
  document.getElementById("prev-scenario").onclick = async () => { await setControl({ risk_index: control.risk_index - 1 }); renderFacilitator(); };
  document.getElementById("next-scenario").onclick = async () => { await setControl({ risk_index: control.risk_index + 1 }); renderFacilitator(); };
}

function renderRiskSummaryHTML(riskRows) {
  const rows = SCENARIOS.map((text, idx) => {
    const counts = { green: 0, amber: 0, red: 0 };
    let total = 0;
    riskRows.forEach((row) => {
      const v = row.votes && row.votes[idx];
      if (v && counts[v] !== undefined) { counts[v] += 1; total += 1; }
    });
    return { text, counts, total };
  });

  return `
    <div style="padding:24px;">
      <div class="card">
        <div style="font-size:14px;font-weight:700;margin-bottom:18px;">All scenarios at a glance</div>
        ${rows.map((r, i) => `
          <div style="padding:14px 0;${i < rows.length - 1 ? "border-bottom:1px solid #EEF1F3;" : ""}">
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:12px;">
              <span style="font-weight:600;font-size:15px;">${i + 1}. ${r.text}</span>
              <span style="font-size:12px;color:var(--muted);white-space:nowrap;">${r.total} vote${r.total === 1 ? "" : "s"}</span>
            </div>
            <div style="display:flex;height:14px;border-radius:6px;overflow:hidden;background:#EEF1F3;">
              ${VOTE_ORDER.map((v) => r.total ? `<div style="width:${(r.counts[v] / r.total) * 100}%;background:${VOTE_COLORS[v]};"></div>` : "").join("")}
            </div>
            <div style="display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--muted);">
              ${VOTE_ORDER.map((v) => `<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${VOTE_COLORS[v]};margin-right:4px;"></span>${VOTE_LABELS[v]}: ${r.counts[v]}</span>`).join("")}
            </div>
          </div>`).join("")}
      </div>
    </div>`;
}

function renderPriorityFacilitatorPanel(panel, control, priorityRows) {
  const stage = control.priority_stage;
  const pillarSubs = priorityRows.filter((d) => d.pillars && d.pillars.length);
  const pillarAverages = PILLARS.map((p) => {
    const ranks = pillarSubs.map((d) => d.pillars.indexOf(p.id)).filter((i) => i !== -1);
    const avg = ranks.length ? ranks.reduce((a, b) => a + b, 0) / ranks.length + 1 : null;
    return { ...p, avg, count: ranks.length };
  }).sort((a, b) => (a.avg === null ? 1 : b.avg === null ? -1 : a.avg - b.avg));

  const elementSubs = priorityRows.filter((d) => d.elements && d.elements.length);
  const elementScores = ELEMENTS.map((e) => {
    let score = 0, count = 0;
    elementSubs.forEach((d) => {
      const idx = d.elements.indexOf(e.id);
      if (idx !== -1) { score += d.elements.length - idx; count++; }
    });
    return { ...e, score, count };
  }).sort((a, b) => b.score - a.score);
  const maxScore = Math.max(1, ...elementScores.map((e) => e.score));

  panel.innerHTML = `
    <div style="padding:24px;">
      <div style="display:flex;gap:12px;margin-bottom:20px;">
        <button class="btn ${stage === 1 ? "btn-dark" : "btn-subtle"}" id="stage1-btn">Stage 1 · Pillar ranking</button>
        <button class="btn ${stage === 2 ? "btn-dark" : "btn-subtle"}" id="stage2-btn">Stage 2 · Top ${ELEMENT_CAP} elements</button>
      </div>
      ${stage === 1 ? `
        <div class="card" style="max-width:620px;">
          <div style="font-size:14px;font-weight:700;margin-bottom:4px;">Aggregate pillar ranking</div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:18px;">${pillarSubs.length} of the room have submitted a ranking</div>
          ${pillarAverages.map((p, i) => `
            <div style="display:flex;align-items:center;padding:12px 0;${i < pillarAverages.length - 1 ? "border-bottom:1px solid #EEF1F3;" : ""}">
              <div class="rank-num" style="margin-right:14px;">${i + 1}</div>
              <div style="flex:1;font-weight:600;font-size:15px;">${p.name}</div>
              <div style="font-size:12px;color:var(--muted);">${p.avg !== null ? `avg rank ${p.avg.toFixed(1)} · ${p.count} votes` : "no votes yet"}</div>
            </div>`).join("")}
        </div>` : `
        <div class="card" style="max-width:700px;">
          <div style="font-size:14px;font-weight:700;margin-bottom:4px;">Top elements (weighted by rank)</div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:18px;">${elementSubs.length} of the room have submitted a ranked list · higher rank = more points</div>
          ${elementScores.map((e) => {
            const pillarName = PILLARS.find((p) => p.id === e.pillar)?.name;
            return `
            <div style="margin-bottom:12px;">
              <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;">
                <span style="font-weight:600;">${e.name} <span style="color:var(--muted);font-weight:400;font-size:12px;">(${pillarName})</span></span>
                <span style="color:var(--muted);">${e.score} pts · picked by ${e.count}</span>
              </div>
              <div class="bar-track" style="height:16px;"><div class="bar-fill" style="width:${(e.score / maxScore) * 100}%;background:var(--blue);"></div></div>
            </div>`;
          }).join("")}
        </div>`}
    </div>`;

  document.getElementById("stage1-btn").onclick = async () => { await setControl({ priority_stage: 1 }); renderFacilitator(); };
  document.getElementById("stage2-btn").onclick = async () => { await setControl({ priority_stage: 2 }); renderFacilitator(); };
}

function exportCSV(riskRows, priorityRows) {
  const rows = [];
  const header = ["deviceId", ...SCENARIOS.map((_, i) => `scenario_${i + 1}`), ...PILLARS.map((p) => `rank_${p.name}`), "top_elements"];
  rows.push(header);
  const riskMap = Object.fromEntries(riskRows.map((r) => [r.device_id, r.votes || {}]));
  const priMap = Object.fromEntries(priorityRows.map((r) => [r.device_id, r]));
  const allIds = Array.from(new Set([...Object.keys(riskMap), ...Object.keys(priMap)]));
  allIds.forEach((id) => {
    const risk = riskMap[id] || {};
    const pr = priMap[id] || {};
    const riskCols = SCENARIOS.map((_, i) => risk[i] || "");
    const pillarRanks = PILLARS.map((p) => {
      const idx = (pr.pillars || []).indexOf(p.id);
      return idx === -1 ? "" : idx + 1;
    });
    const elementNames = (pr.elements || []).map((eid, i) => `${i + 1}. ${ELEMENTS.find((e) => e.id === eid)?.name || eid}`).join("; ");
    rows.push([shortId(id), ...riskCols, ...pillarRanks, elementNames]);
  });
  const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "hb-workshop-votes.csv";
  a.click();
  URL.revokeObjectURL(url);
}

renderRoleSelect();
